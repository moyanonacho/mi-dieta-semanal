<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0E0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Dieta">
<link rel="icon" href="icono.png">
<link rel="apple-touch-icon" href="icono.png">
<link rel="manifest" href="manifest.webmanifest">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mi Dieta Semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: estética de box de entrenamiento — cabecera negra con título a todo lo ancho, cinta de aviso amarilla, contenido en tarjetas, pestañas flotantes abajo */
:root{
  --band:#0E0E0E; --band-2:#1D1D1B; --band-ink:#F5F5F0; --band-muted:#A3A39A; --hi:#FFD60A; --hi-ink:#111111;
  --bg:#ECECE7; --surface:#FFFFFF; --sunk:#F2F2EC; --line:#D9D9D1;
  --fg:#141414; --muted:#5E5E57; --accent:#FFD60A; --accent-ink:#111111; --accent-soft:#FFF3B8;
  --prot:#2F5FD0; --carb:#D98200; --fat:#D23C6A;
  --good:#1E8A4A; --warn:#B26E00; --bad:#D0342C;
  --good-soft:#DCF2E3; --warn-soft:#FFF0CC; --bad-soft:#FBDEDA;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.06);
  --f-title:"Anton","Barlow Condensed",Impact,"Arial Narrow",sans-serif;
  --f-display:"Barlow Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Barlow",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --band:#050505; --band-2:#161616; --band-ink:#F2F2EC; --band-muted:#9A9A92; --hi:#FFD60A; --hi-ink:#111111;
  --bg:#0D0D0D; --surface:#171717; --sunk:#1F1F1F; --line:#2D2D2B;
  --fg:#EEEEE8; --muted:#A0A098; --accent:#FFD60A; --accent-ink:#111111; --accent-soft:#2E2706;
  --prot:#7FA3F0; --carb:#F0A93A; --fat:#EE7FA0;
  --good:#4CC27E; --warn:#F0B13D; --bad:#F2766A;
  --good-soft:#123222; --warn-soft:#352A0E; --bad-soft:#3E1C19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#050505; --band-2:#161616; --band-ink:#F2F2EC; --band-muted:#9A9A92; --hi:#FFD60A; --hi-ink:#111111;
  --bg:#0D0D0D; --surface:#171717; --sunk:#1F1F1F; --line:#2D2D2B;
  --fg:#EEEEE8; --muted:#A0A098; --accent:#FFD60A; --accent-ink:#111111; --accent-soft:#2E2706;
  --prot:#7FA3F0; --carb:#F0A93A; --fat:#EE7FA0;
  --good:#4CC27E; --warn:#F0B13D; --bad:#F2766A;
  --good-soft:#123222; --warn-soft:#352A0E; --bad-soft:#3E1C19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15.5px;line-height:1.45;
  padding-bottom:calc(108px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:1.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1}
h3{font-size:1.15rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)}
.small{font-size:.87rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
label.f{display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600}
a{color:inherit;text-decoration-color:var(--hi);text-decoration-thickness:2px;text-underline-offset:3px}

/* Cabecera */
header.hero{background:var(--band);color:var(--band-ink);position:relative;overflow:hidden;isolation:isolate}
header.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;
  background:radial-gradient(90% 120% at 50% 0%,var(--band-2),transparent 70%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 44px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 44px)}
.hero .deco{position:absolute;z-index:-1;color:var(--band-ink);opacity:.07;pointer-events:none}
.hero .deco.kb{width:210px;left:-46px;bottom:6px;transform:rotate(-12deg)}
.hero .deco.db{width:230px;right:-60px;top:18px;transform:rotate(18deg)}
.hero .pulse{position:absolute;left:0;right:0;top:46%;height:70px;z-index:-1;width:100%;color:var(--hi);opacity:.22;pointer-events:none}
.hero-in{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 22px;display:grid;gap:14px;justify-items:center;text-align:center}
.eyebrow{width:100%;display:flex;justify-content:center;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:.92rem}
.eyebrow .wk{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.1em;background:var(--hi);color:var(--hi-ink);padding:3px 10px;border-radius:6px;transform:skewX(-8deg);white-space:nowrap}
.eyebrow .quote{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:1.05rem;color:var(--band-ink);letter-spacing:.01em;text-wrap:balance}
.eyebrow .quote::before{content:"“";color:var(--hi);margin-right:2px}
.eyebrow .quote::after{content:"”";color:var(--hi);margin-left:2px}
.title{width:100%;margin:0;font-family:var(--f-title);font-weight:400;text-transform:uppercase;line-height:1;letter-spacing:.01em;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .3em;font-size:clamp(2rem,8.5vw,3.4rem)}
.title .l2{color:var(--hi);font-style:italic;display:inline-block;transform:skewX(-7deg)}
.pillars{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pillars span{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px 5px 8px;font-family:var(--f-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;color:var(--band-ink)}
.pillars svg{width:18px;height:18px;stroke:var(--hi);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.week{width:100%;max-width:520px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:6px}
.week .lbl{flex:1;text-align:center;font-weight:800;font-family:var(--f-display);font-size:1.2rem;text-transform:uppercase;letter-spacing:.03em}
.week .lbl small{display:block;font-family:var(--f-body);font-weight:600;color:var(--band-muted);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.iconbtn{width:46px;height:46px;border-radius:12px;border:0;background:var(--hi);color:var(--hi-ink);display:grid;place-items:center;font-size:1.6rem;line-height:1;font-weight:800}
.iconbtn:hover{filter:brightness(1.08)}
.status{font-size:.75rem;color:var(--band-muted);display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hi)}
.tape{height:14px;background:repeating-linear-gradient(-45deg,var(--hi) 0 14px,var(--band) 14px 28px)}

/* Pestañas: barra flotante abajo */
nav.tabs{position:fixed;z-index:6;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  max-width:calc(780px - 32px);margin:0 auto;background:var(--band);border:1px solid #2A2A28;border-radius:20px;padding:6px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
  box-shadow:0 12px 30px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25)}
nav.tabs a{display:grid;justify-items:center;gap:3px;padding:8px 2px 7px;border-radius:14px;text-decoration:none;color:var(--band-muted);font-family:var(--f-display);font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:background .2s,color .2s}
nav.tabs a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a:hover{color:var(--band-ink)}
nav.tabs a[aria-current="page"]{color:var(--hi-ink);background:var(--hi)}
.viewhead{display:flex;align-items:center;gap:12px}
.viewhead .ico{width:46px;height:46px;border-radius:12px;background:var(--band);color:var(--hi);display:grid;place-items:center;flex:none;transform:skewX(-6deg)}
.viewhead .ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Elementos comunes */
.stack{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-family:var(--f-display);font-weight:800;font-size:1rem;text-transform:uppercase;letter-spacing:.05em;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--sunk);color:var(--muted)}
.banner{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:14px;padding:12px 14px;font-size:.9rem;display:grid;gap:8px}
.empty{text-align:center;padding:28px 12px;color:var(--muted);display:grid;gap:10px;justify-items:center}
.macros{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.macros b{font-family:var(--f-num);font-weight:500;color:var(--fg)}
.m-p{color:var(--prot)} .m-c{color:var(--carb)} .m-g{color:var(--fat)}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px}

/* Menú */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.stat:first-child{background:var(--band);border-color:var(--band);color:var(--band-ink)}
.stat:first-child .k,.stat:first-child .v small{color:var(--band-muted)}
.stat:first-child .v{color:var(--hi)}
.stat .k{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.stat .v{font-family:var(--f-title);font-size:2rem;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.1}
.stat .v small{font-size:.8rem;font-weight:600;color:var(--muted);font-family:var(--f-body)}
.day{padding:0;overflow:hidden}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--sunk)}
.dayhead h3{display:flex;align-items:center;gap:10px;font-size:1.1rem}
.dayhead h3 .dnum{width:42px;height:42px;border-radius:10px;background:var(--band);color:var(--hi);display:grid;place-items:center;font-family:var(--f-title);font-weight:400;font-size:1.35rem;line-height:1;transform:skewX(-6deg)}
.dayhead h3 span.dm{color:var(--muted);font-weight:600;font-family:var(--f-body);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.meal{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.meal:last-child{border-bottom:0}
.meal:hover{background:var(--sunk)}
.meal .mn{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{background:var(--accent-soft);color:var(--fg);border-radius:10px;padding:4px 10px;font-size:.88rem;font-weight:500}
:root{--c-v:#1FA35B;--c-a:#2F6FDB;--c-n:#F08A00;--c-r:#E03A3A}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;margin-right:6px;vertical-align:middle}
.c-v{background:var(--c-v)} .c-a{background:var(--c-a)} .c-n{background:var(--c-n)} .c-r{background:var(--c-r)}
.meal .mbody{display:grid;gap:6px;min-width:0}
.th{display:grid;place-items:center;width:46px;height:46px;border-radius:10px;flex:none;border:1px solid var(--line)}
.th.ph{background:var(--sunk);color:var(--muted);font-family:var(--f-title);font-size:1.2rem;text-transform:uppercase}
.th.mini{display:inline-grid;width:24px;height:24px;border-radius:6px;margin-right:6px;vertical-align:middle;font-size:.75rem}
.chip{display:inline-flex;align-items:center}
.bhead{margin:-16px -16px 12px;padding:10px 16px;background:var(--band);color:var(--hi);border-radius:15px 15px 0 0;font-size:1.1rem;letter-spacing:.05em}
.verdict .bhead{margin:-18px -18px 8px;padding:10px 18px}
.card.stack > .bhead{margin-bottom:-2px}
table.acc{width:100%;border-collapse:collapse;min-width:320px}
table.acc th,table.acc td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
table.acc thead th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
table.acc tbody th{text-align:left;font-weight:600}
table.acc tbody th small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
table.acc tr.total th,table.acc tr.total td{border-top:2px solid var(--fg);font-weight:800}
table.acc td{white-space:nowrap}
.dchart{width:100%;height:auto;display:block}
.dchart .grid{stroke:var(--line);stroke-width:1}
.dchart .axis{stroke:var(--muted);stroke-width:1}
.dchart .tick{fill:var(--muted);font-family:var(--f-num);font-size:12px}
.dchart .dl{fill:var(--fg);font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase}
.dchart .dd{font-family:var(--f-num);font-size:12px;font-weight:600}
.dchart .dd.neg{fill:var(--good)} .dchart .dd.pos{fill:var(--bad)}
.dchart .hit{fill:transparent}
.dchart .dg:hover .hit{fill:var(--sunk)}
.cal{display:grid;gap:10px}
.k-f{--k:var(--prot)} .k-m{--k:var(--carb)} .k-c{--k:var(--good)} .k-d{--k:var(--fat)} .k-y{--k:var(--muted)}
.sw.k-f,.sw.k-m,.sw.k-c,.sw.k-d,.sw.k-y{background:var(--k)}
/* lunes a viernes en una fila; sábado y domingo debajo */
.calgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.calday{display:grid;grid-template-rows:auto 1fr auto;background:var(--sunk);border-radius:12px;overflow:hidden;min-height:170px;min-width:0}
.ses{min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){
  .calgrid{gap:4px}
  .calhead{padding:6px 6px;font-size:.8rem;letter-spacing:.03em}
  .calhead .cnum{font-size:1.05rem}
  .calbody{padding:5px;gap:5px}
  .ses{padding:5px 5px 5px 6px;font-size:.68rem;border-left-width:3px}
  .ses b{font-size:.8rem}
  .restlbl{font-size:.7rem}
  .calfoot{padding:4px 6px;font-size:.68rem}
  .calday{min-height:140px}
}
.calhead{display:flex;justify-content:space-between;align-items:baseline;padding:8px 10px;background:var(--band);color:var(--band-ink);font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em}
.calhead .cnum{font-family:var(--f-title);font-size:1.3rem;line-height:1;color:var(--band-muted)}
.calday.today .calhead{background:var(--hi);color:var(--hi-ink)}
.calday.today .calhead .cnum{color:var(--hi-ink)}
.calbody{display:flex;flex-direction:column;gap:6px;padding:8px}
.ses{display:grid;gap:1px;text-align:left;border:0;border-left:4px solid var(--k);background:var(--surface);border-radius:8px;padding:7px 8px;font-size:.78rem;color:var(--muted);box-shadow:var(--shadow)}
.ses b{color:var(--fg);font-family:var(--f-display);font-size:.98rem;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
.ses .num{color:var(--fg)}
.restlbl{color:var(--muted);font-size:.8rem;font-style:italic;text-align:center;padding:10px 0}
.caladd{margin-top:auto;border:1px dashed var(--line);background:transparent;border-radius:8px;min-height:34px;font-size:1.2rem;font-weight:800;color:var(--muted)}
.caladd:hover{border-color:var(--fg);color:var(--fg)}
.calfoot{padding:6px 10px;border-top:1px solid var(--line);font-size:.78rem;text-align:right;color:var(--muted)}
:root{--cheat:#D9366F}
.cheattag{display:inline-block;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:.72rem;background:var(--cheat);color:#fff;padding:3px 8px;border-radius:6px;transform:skewX(-8deg);white-space:nowrap}
.mrow.cheat{background:repeating-linear-gradient(-45deg,transparent 0 12px,var(--sunk) 12px 24px)}
.mrow.cheat .mic{background:var(--cheat);color:#fff}
.cheatbtn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:10px 12px;font-size:.88rem;color:var(--muted)}
.cheatbtn:hover{border-color:var(--cheat);color:var(--fg)}
.cheatbox{border:2px solid var(--cheat);border-radius:14px;padding:14px}
.cheathead{display:grid;gap:6px;justify-items:start}
/* Comida abierta */
.bhero{margin:-16px -16px 0;padding:8px 16px 14px;background:var(--band);color:var(--band-ink);border-radius:20px 20px 0 0;display:grid;gap:10px}
.bhero .grab{background:rgba(255,255,255,.25)}
.bhtop{display:flex;align-items:center;gap:12px}
.mic.big{width:48px;height:48px;border-radius:14px;background:var(--hi);color:var(--hi-ink)}
.mic.big svg{width:26px;height:26px}
.bht{flex:1;min-width:0;display:grid}
.bht small{color:var(--band-muted);text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;font-weight:700}
.bht h2{font-family:var(--f-title);font-weight:400;font-size:1.9rem;line-height:1;letter-spacing:.01em}
.bhmac{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--band-muted)}
.bhmac b{color:var(--band-ink)} .bhmac .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.racs{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.rt{display:grid;gap:4px;padding:10px 12px;border-radius:12px;background:var(--sunk);border-top:4px solid var(--gc)}
.rt .k{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rt .v{font-family:var(--f-title);font-size:1.5rem;line-height:1}
.rt .v small{font-size:.65em;color:var(--muted)}

.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-weight:600;font-size:.85rem;min-width:40px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Balance */
.verdict{display:grid;gap:6px;padding:18px}
.verdict .big{font-family:var(--f-title);font-size:2.4rem;font-weight:400;line-height:1;text-transform:uppercase}
.verdict.lose{border-color:var(--good);background:linear-gradient(0deg,var(--good-soft),var(--surface))}
.verdict.gain{border-color:var(--bad);background:linear-gradient(0deg,var(--bad-soft),var(--surface))}
.verdict.keep{border-color:var(--warn);background:linear-gradient(0deg,var(--warn-soft),var(--surface))}
.ledger{display:grid;gap:0}
.ledger .r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ledger .r:first-child{border-top:0}
.ledger .r.total{font-weight:700;border-top:2px solid var(--fg)}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:42px 1fr 64px;gap:8px;align-items:center;font-size:.85rem}
.barrow .tracks{display:grid;gap:3px}
.track{height:9px;border-radius:5px;background:var(--sunk);position:relative;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.track .in{background:var(--accent)}
.track .out{background:var(--muted)}
.track .sp{background:var(--carb)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.mrow{display:grid;grid-template-columns:90px 1fr 110px;gap:8px;align-items:center;font-size:.88rem}
.mrow .track{height:10px}
.mrow .track b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg)}
/* Objetivo */
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.tips{display:grid;gap:8px}
.tip{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--sunk)}
.tip .mark{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;background:var(--surface);color:var(--muted)}
.tip.good{background:var(--good-soft)} .tip.good .mark{color:var(--good)}
.tip.warn{background:var(--warn-soft)} .tip.warn .mark{color:var(--warn)}
.tip.bad{background:var(--bad-soft)} .tip.bad .mark{color:var(--bad)}
.tip ul{margin:4px 0 0;padding-left:18px}
.claude{border:1px solid var(--accent);border-radius:12px;padding:12px 14px;background:var(--accent-soft);font-size:.92rem}
@media (max-width:480px){.meal{grid-template-columns:1fr;gap:4px}.mrow{grid-template-columns:70px 1fr 92px}.formgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

<script>
/* Puente con Supabase: imita la base de datos y las fotos de claude.ai, con cuentas de usuario.
   Cada usuario solo lee y escribe sus filas (reglas de seguridad de Supabase). */
const SB_URL='https://eralhpnstnbyznwthkmz.supabase.co',SB_KEY='sb_publishable_8_hwEm1tK5NS3G0iRbj9kw_CZMsvBbu';
const SB=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'mi-dieta-semanal'}});
const CAT_BASE=SB_URL+'/storage/v1/object/public/catalogo/mercadona/';
const fotoUrl=id=>SB_URL+'/storage/v1/object/public/dieta-fotos/'+String(id).split('/').map(encodeURIComponent).join('/');
let UID=null,EMAIL='';let authResolve;const AUTH_READY=new Promise(r=>authResolve=r);
const newId=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,'');
const SBDB=(()=>{
  const W={},timers={};let chan=null;
  const META={fromCache:false,hasPendingWrites:false};
  const fire=col=>{clearTimeout(timers[col]);timers[col]=setTimeout(()=>(W[col]||new Set()).forEach(f=>f()),100)};
  const fireAll=()=>Object.keys(W).forEach(fire);
  const listen=()=>{if(chan)return;chan=SB.channel('dieta-'+UID).on('postgres_changes',{event:'*',schema:'public',table:'dieta_docs',filter:'user_id=eq.'+UID},p=>{const c=(p.new&&p.new.col)||(p.old&&p.old.col);c?fire(c):fireAll()}).subscribe(s=>{if(s==='SUBSCRIBED')fireAll()})};
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)fireAll()});
  const err=e=>{const x=new Error((e&&e.message)||'error');x.code=(e&&e.code)||'unavailable';return x};
  const watch=(col,f)=>{(W[col]||(W[col]=new Set())).add(f);listen();f();return()=>{W[col]&&W[col].delete(f)}};
  const merge=(a,b)=>{if(!a||typeof a!=='object'||Array.isArray(a)||!b||typeof b!=='object'||Array.isArray(b))return b;const o={...a};for(const k in b)o[k]=merge(a[k],b[k]);return o};
  const docRef=(col,id)=>({id,path:col+'/'+id,
    async get(){const{data,error}=await SB.from('dieta_docs').select('data').eq('col',col).eq('id',id).maybeSingle();if(error)throw err(error);return{id,exists:!!data,data:()=>data?data.data:undefined,metadata:META}},
    async set(d){const{error}=await SB.from('dieta_docs').upsert({user_id:UID,col,id,data:d,updated_at:new Date().toISOString()},{onConflict:'user_id,col,id'});if(error)throw err(error);fire(col)},
    async update(d){const s=await this.get();if(!s.exists)throw err({code:'invalid_argument',message:'no existe'});await this.set(merge(s.data(),d))},
    async delete(){const{error}=await SB.from('dieta_docs').delete().eq('col',col).eq('id',id);if(error)throw err(error);fire(col)},
    onSnapshot(next,onErr){const r=this;return watch(col,async()=>{try{next(await r.get())}catch(e){onErr&&onErr(e)}})}});
  const colRef=col=>{const q={path:col,
    doc:id=>docRef(col,id||newId()),
    async add(d){const r=docRef(col,newId());await r.set(d);return r},
    async get(){const{data,error}=await SB.from('dieta_docs').select('id,data').eq('col',col).limit(2000);if(error)throw err(error);const docs=(data||[]).map(r=>({id:r.id,exists:true,data:()=>r.data,metadata:META}));return{docs,size:docs.length,empty:!docs.length,metadata:META,docChanges:()=>[]}},
    onSnapshot(next,onErr){return watch(col,async()=>{try{next(await q.get())}catch(e){onErr&&onErr(e)}})},
    where(){return q},orderBy(){return q},limit(){return q}};return q};
  return{doc:p=>{const i=p.lastIndexOf('/');return docRef(p.slice(0,i),p.slice(i+1))},collection:colRef};
})();
const SBASSETS={

    if(error){const x=new Error(error.message);x.code=/size|large/i.test(error.message)?'too_large':'upstream_error';throw x}return{id,url:fotoUrl(id)}},
  async delete(id){await SB.storage.from('dieta-fotos').remove([id]);return{deleted:true}}};
window.claude={use:async name=>{await AUTH_READY;return name==='db'?SBDB:name==='assets'?SBASSETS:null}};

/* ----- Entrar, crear cuenta, recuperar contraseña ----- */
const ESC=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BASE=location.origin+location.pathname;
let AMODE='login';
const ERRS=[[/invalid login/i,'Email o contraseña incorrectos.'],[/not confirmed/i,'Todavía no has confirmado tu cuenta: abre el enlace del correo que te enviamos.'],[/already registered|already been registered/i,'Ya existe una cuenta con ese email. Entra o recupera la contraseña.'],[/rate limit|too many/i,'Demasiados intentos. Espera unos minutos y vuelve a probar.'],[/at least 6|password should/i,'La contraseña debe tener al menos 6 caracteres.'],[/valid email|invalid email|unable to validate email/i,'Ese email no parece válido.'],[/signups? not allowed|disabled/i,'Ahora mismo no se pueden crear cuentas nuevas.']];
const errTxt=e=>{const m=(e&&e.message)||'';const f=ERRS.find(([r])=>r.test(m));return f?f[1]:'No se pudo completar. Revisa tu conexión y vuelve a probar.'};
function showAuth(mode,msg,ok){
  AMODE=mode;let el=document.getElementById('auth');
  if(!el){el=document.createElement('div');el.id='auth';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el)}
  const em=ESC(el.dataset.email||'');
  const F={
    login:`<h2>Entrar</h2><label class="f">Email<input id="a_em" type="email" autocomplete="username" required value="${em}"></label><label class="f">Contraseña<input id="a_pw" type="password" autocomplete="current-password" required></label><button class="btn primary">Entrar</button><div class="alinks"><button type="button" data-am="signup">Crear una cuenta</button><button type="button" data-am="forgot">He olvidado la contraseña</button></div>`,
    signup:`<h2>Crear cuenta</h2><label class="f">Email<input id="a_em" type="email" autocomplete="username" required value="${em}"></label><label class="f">Contraseña (mínimo 6 caracteres)<input id="a_pw" type="password" autocomplete="new-password" minlength="6" required></label><label class="f">Repite la contraseña<input id="a_pw2" type="password" autocomplete="new-password" minlength="6" required></label><button class="btn primary">Crear cuenta</button><div class="alinks"><button type="button" data-am="login">Ya tengo cuenta</button></div>`,
    forgot:`<h2>Recuperar contraseña</h2><label class="f">Email de tu cuenta<input id="a_em" type="email" autocomplete="username" required value="${em}"></label><button class="btn primary">Enviarme un enlace</button><div class="alinks"><button type="button" data-am="login">Volver a entrar</button></div>`,
    newpass:`<h2>Nueva contraseña</h2><label class="f">Contraseña nueva (mínimo 6 caracteres)<input id="a_pw" type="password" autocomplete="new-password" minlength="6" required></label><button class="btn primary">Guardar contraseña</button>`};
  el.innerHTML=`<div class="abox"><h1 class="atitle">Mi Dieta <span>Semanal</span></h1><p class="asub">Tu dieta, tu menú, tu compra y tu entreno. Cada cuenta ve solo sus datos.</p><form id="aform" novalidate>${F[mode]}<p class="amsg ${ok?'ok':'err'}" role="status">${ESC(msg||'')}</p></form></div>`;
  el.hidden=false;setTimeout(()=>{const i=el.querySelector('input:not([value]),input[value=""]')||el.querySelector('input');i&&i.focus()},30);
}
function hideAuth(){const el=document.getElementById('auth');if(el)el.hidden=true}
function signedIn(s){
  if(UID)return;UID=s.user.id;EMAIL=s.user.email||'';hideAuth();
  const hi=document.querySelector('.hero-in');
  if(hi&&!document.querySelector('.userbar'))hi.insertAdjacentHTML('afterbegin',`<div class="userbar"><span>${ESC(EMAIL)}</span><button type="button" id="logout">Salir</button></div>`);
  authResolve();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-am]');if(b){const el=document.getElementById('auth');const em=document.getElementById('a_em');if(em)el.dataset.email=em.value;showAuth(b.dataset.am);return}
  if(e.target.id==='logout'){SB.auth.signOut().finally(()=>location.reload())}
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='aform')return;e.preventDefault();
  const msg=e.target.querySelector('.amsg'),btn=e.target.querySelector('.btn.primary');
  const say=(t,ok)=>{msg.textContent=t;msg.className='amsg '+(ok?'ok':'err')};
  const em=(document.getElementById('a_em')||{}).value?.trim(),pw=(document.getElementById('a_pw')||{}).value||'';
  if(AMODE!=='newpass'&&!em){say('Escribe tu email.');return}
  if(AMODE!=='forgot'&&pw.length<6){say('La contraseña debe tener al menos 6 caracteres.');return}
  if(AMODE==='signup'&&pw!==document.getElementById('a_pw2').value){say('Las dos contraseñas no coinciden.');return}
  btn.disabled=true;say('Un momento…',true);
  try{
    if(AMODE==='login'){const{data,error}=await SB.auth.signInWithPassword({email:em,password:pw});if(error)throw error;signedIn(data.session)}
    else if(AMODE==='signup'){const{data,error}=await SB.auth.signUp({email:em,password:pw,options:{emailRedirectTo:BASE}});if(error)throw error;
      if(data.session)signedIn(data.session);else{document.getElementById('auth').dataset.email=em;showAuth('login','Cuenta creada. Te hemos enviado un correo: abre el enlace para confirmarla y después entra aquí.',true)}}
    else if(AMODE==='forgot'){const{error}=await SB.auth.resetPasswordForEmail(em,{redirectTo:BASE});if(error)throw error;say('Si existe una cuenta con ese email, te llegará un enlace para poner una contraseña nueva.',true)}
    else if(AMODE==='newpass'){const{data,error}=await SB.auth.updateUser({password:pw});if(error)throw error;const s=(await SB.auth.getSession()).data.session;if(s)signedIn(s)}
  }catch(err){say(errTxt(err))}finally{btn.disabled=false}
});
SB.auth.onAuthStateChange((ev,session)=>{
  if(ev==='PASSWORD_RECOVERY'){showAuth('newpass');return}
  if(ev==='SIGNED_IN'&&session&&AMODE!=='newpass')signedIn(session);
  if(ev==='SIGNED_OUT'&&UID)location.reload();
});
(async()=>{let s=null;try{s=(await SB.auth.getSession()).data.session}catch(_){}if(s&&AMODE!=='newpass')signedIn(s);else if(!UID)showAuth(AMODE==='newpass'?'newpass':'login')})();
</script>

const savers = {};
function saveDoc(path, getData, delay=350){
  const s = savers[path] || (savers[path] = {timer:null, chain:Promise.resolve(), dirty:false});
  s.dirty = true;
  clearTimeout(s.timer);
  s.timer = setTimeout(() => {
    s.timer = null;
    if(!S.db){ s.dirty=false; return; }
    const data = clone(getData());
    setStatus("Guardando…");
    s.chain = s.chain.then(() => S.db.doc(path).set(data)).then(() => {
      if(!s.timer) s.dirty=false; setStatus("Guardado");
    }).catch(e => { s.dirty=false; setStatus("No se pudo guardar: " + (e?.code||"error")); });
  }, delay);
}
const busy = path => !!(savers[path] && (savers[path].timer || savers[path].dirty));

const platosList = () => Object.entries(S.platos).map(([id,p]) => ({id, ...p})).filter(p=>Array.isArray(p.items));

// Cada comida guarda [{a: id del alimento, r: raciones}]
function slot(day, meal){ return ((S.semana.menu?.[day]?.[meal])||[]).filter(x=>x && typeof x==="object" && alim(x.a)); }
function slotArr(day, meal){ const m=S.semana.menu; m[day] ||= {}; const cur=(m[day][meal]||[]).filter(x=>x && typeof x==="object"); m[day][meal]=cur; return cur; }
const racKcal = g => { const v=S.plan?.rac?.[g]; return v ? v.c*4+v.p*4+v.g*9 : 0; };
function itemsTotals(items){
  const t={c:0,p:0,g:0,kcal:0,n:0,r:{}}; const R=S.plan?.rac||{};
  const add=(g,n)=>{ const v=R[g]; if(!v) return; t.c+=v.c*n; t.p+=v.p*n; t.g+=v.g*n; t.r[g]=(t.r[g]||0)+n; };
  for(const it of items){ const a=alim(it.a); if(!a) continue; t.n++; const r=+it.r||0; add(a.grp,r); for(const [g,k] of Object.entries(a.x||{})) add(g,k*r); }
  t.kcal = t.c*4+t.p*4+t.g*9; return t;
}
const isTrainDay = d => S.semana.deporte.some(s=>s.dia===d);
// Cheat meal: comida fuera del plan (restaurante, a domicilio, evento). Sus alimentos no cuentan; se suma una estimación.
const CHEAT_T = {rest:"Restaurante", casa:"A domicilio", evento:"Evento", otro:"Otro"};
const CHEAT_K = [{k:600,n:"Ligera"},{k:900,n:"Normal"},{k:1300,n:"Copiosa"}];
const cheatOf = (d,m) => S.semana.cheat?.[d]?.[m] || null;
const cheatMac = k => ({c:k*0.45/4, p:k*0.20/4, g:k*0.35/9});
function dayTotals(day){
  const t = itemsTotals(MEALS.filter(m=>!cheatOf(day,m.id)).flatMap(m=>slot(day,m.id)));
  t.cheats = 0;
  for(const m of MAIN_MEALS){ const ch = cheatOf(day,m); if(ch){ const q = cheatMac(+ch.k||0); t.c+=q.c; t.p+=q.p; t.g+=q.g; t.n++; t.cheats++; } }
  t.kcal = t.c*4+t.p*4+t.g*9;
  // El batido post-entreno solo cuenta el día que lo marcas en el Menú
  if(S.semana.batido?.[day] && S.plan?.post){ const q=S.plan.post; t.c+=q.c; t.p+=q.p; t.g+=q.g; t.kcal=t.c*4+t.p*4+t.g*9; t.post=true; }
  return t;
}
function dayTarget(d){ const r={}; for(const m of MEALS){ if(d!=null && cheatOf(d,m.id)) continue; for(const [g,n] of Object.entries(mealDist(m.id))) r[g]=(r[g]||0)+n; } return r; }
const planMacros = () => S.plan?.macros || S.perfil.objetivo || {};
function normQ(q,u){ u=String(u||"ud").trim().toLowerCase(); if(UNIT_NORM[u]){ q*=UNIT_NORM[u][1]; u=UNIT_NORM[u][0]; } return {q,u}; }
function porText(a, r){ return (a.por||[]).map(p=>{ const x=normQ(p.q*r,p.u); return (a.por.length>1?esc(p.n)+" ":"")+fmtQty(x.q,x.u); }).join(" + "); }
const xText = (a, r=1) => a.x ? " · cuenta también " + Object.entries(a.x).map(([k,v])=>`${nf(v*r,1)} ${GRP[k].s}`).join(", ") : "";
function bmr(){
  const {sexo,edad,peso,altura}=S.perfil;
  if(!(+edad && +peso && +altura)) return null;
  return 10*peso + 6.25*altura - 5*edad + (sexo==="m" ? -161 : 5);
}
const pesoKg = () => +S.perfil.peso || 0;
function sessKcal(s){
  const a=ACTS.find(x=>x.id===s.act); const i=INTENS.find(x=>x.id===s.int)||INTENS[1];
  if(!a || !pesoKg()) return 0;
  // Gasto NETO: se resta 1 MET porque el gasto en reposo ya está en el metabolismo basal
  return Math.max(0, (a.met*i.f - 1)) * pesoKg() * (+s.min||0)/60;
}

const UNIT_NORM = {kg:["g",1000], g:["g",1], gr:["g",1], l:["ml",1000], ml:["ml",1], cl:["ml",10]};
function fmtQty(q,u){
  if(u==="g" && q>=1000) return nf(q/1000,2)+" kg";
  if(u==="ml" && q>=1000) return nf(q/1000,2)+" l";
  if(u==="ud") return nf(q,1)+(q===1?" unidad":" unidades");
  return nf(q,1)+" "+u;
}
function shoppingList(){
  const map = new Map();
  for(let d=0; d<7; d++) for(const m of MEALS) for(const it of (cheatOf(d,m.id) ? [] : slot(d,m.id))){
    const a = alim(it.a);
    for(const p of (a.por||[])){
      const {q,u} = normQ(p.q*(+it.r||0), p.u);
      const key = norm(p.n)+"|"+u;
      const x = map.get(key) || {key, n:p.n, u, q:0, cat:a.cat||"Otros", uses:{}};
      x.q += q; x.uses[m.n] = (x.uses[m.n]||0)+1; map.set(key, x);
    }
  }
  return [...map.values()];
}

      h += `<button class="mrow shake ${on?"on":""}" data-act="batido" data-day="${d}" aria-pressed="${on}"><span class="mic">${MEAL_ICO.batido}</span>
        <span class="mcol"><span class="mtop"><b class="mname">Batido post-entreno</b><span class="switch" aria-hidden="true"><i></i></span></span>
        <span class="small muted">${on?`Tomado · suma ${nf(k)} kcal y ${nf(q.p)} g de proteína`:`No tomado${isTrainDay(d)?" · hoy entrenas":""} · 25 g de proteína ISO + 5 g de creatina`}</span></span></button>`; }
    h += `</div>`;
    h += `</section>`;
  });
  return h;
}

/* ----- Repetir el menú de esta semana en las siguientes ----- */
function monthWeeks(){ let n=0; for(let m=addDays(S.monday,7); m.getMonth()===S.monday.getMonth(); m=addDays(m,7)) n++; return n; }
function openRepeat(){
  const left = monthWeeks();
  openSheet("", {type:"repeat", left, n: left || 4});
  drawRepeat();
}
function drawRepeat(){
  const c = sheetCtx, opts = [...new Set([c.left, 1, 2, 3, 4].filter(Boolean))].sort((a,b)=>a-b);
  const weeks = Array.from({length:c.n}, (_,i)=>addDays(S.monday, 7*(i+1)));
  const has = MEALS.some(m=>DAYS.some((_,d)=>slot(d,m.id).length));
  $("#sheetInner").innerHTML = `<div class="grab"></div><div class="sectionhead"><div><h2>Repetir este menú</h2><div class="muted small">Copia el menú de esta semana en las semanas siguientes.</div></div><button class="btn ghost" data-act="close">Cancelar</button></div>
    ${has ? `<div class="small muted" style="font-weight:700">¿En cuántas semanas?</div>

async function repeatMenu(btn){
  if(!S.db){ setStatus("Sin conexión con los datos"); return; }
  const n = sheetCtx.n; btn.disabled = true; btn.textContent = "Copiando…";
  const menu = {};
  for(const d of Object.keys(S.semana.menu||{})) for(const m of Object.keys(S.semana.menu[d]||{})){
    const items = (S.semana.menu[d][m]||[]).filter(x=>x && typeof x==="object");
    if(items.length) (menu[d] ||= {})[m] = clone(items);
  }
  try{
    for(let i=1; i<=n; i++){
      const ref = S.db.doc("semanas/" + weekKey(addDays(S.monday, 7*i)));
      const snap = await ref.get();
      const w = weekOf(snap.exists ? clone(snap.data()) : null);
      w.menu = clone(menu);
      await ref.set(w);
    }
    closeSheet(); render(); setStatus(`Menú copiado en ${n} ${n===1?"semana":"semanas"}`);
  }catch(e){ btn.disabled = false; btn.textContent = "Reintentar"; setStatus("No se pudo copiar el menú"); }
}

// ----- Platos: reconocer el plato elegido, su foto y el nivel de cada macro -----
function matchPlato(items, meal){
  if(!items.length) return null;
  let best = null;
  for(const p of platosList()){
    if(p.comida!==meal || !p.items.length) continue;
    const rest = [...items]; let ok = true;
    for(const pi of p.items){ const i = rest.findIndex(x=>x.a===pi.a && Math.abs((+x.r||0)-(+pi.r||0))<0.01); if(i<0){ ok=false; break; } rest.splice(i,1); }
    if(ok && (!best || p.items.length > best.p.items.length)) best = {p, extra:rest};
  }
  return best;
}
function dishPic(p, cls){
  if(p.foto) return `<img class="dish ${cls}" src="${esc(fotoUrl(p.foto))}" alt="${esc(p.nombre||"Plato")}"${p.credito?` title="${esc(p.credito)}"`:""} loading="lazy">`;
  const its = (p.items||[]).map(it=>alim(it.a)).filter(Boolean).slice(0,4);
  return `<span class="dish col n${its.length} ${cls}" aria-hidden="true">${its.map(a=>thumb(a,"cq")).join("")}</span>`;
}
function levels(mt, meal){
  const R = S.plan?.rac||{}, d = mealDist(meal), tg = {c:0,p:0,g:0};
  for(const [g,n] of Object.entries(d)){ const v=R[g]; if(v){ tg.c+=v.c*n; tg.p+=v.p*n; tg.g+=v.g*n; } }
  return `<span class="lvls">` + [["HC","c","var(--carb)"],["Prot","p","var(--prot)"],["Grasa","g","var(--fat)"]].map(([n,k,col])=>{
    const v = mt[k], t = tg[k], r = t ? v/t : 0;
    const lv = !t ? "" : r < 0.85 ? "bajo" : r > 1.15 ? "alto" : "justo";
    return `<span class="lv ${lv}"><b>${n}</b><i style="--c:${col};--w:${Math.min(100, r*100)}%"></i><small class="num">${nf(v)} g</small><em>${lv}</em></span>`;
  }).join("") + `</span>`;
}
async function uploadDishPhoto(file){
  const assets = await window.claude?.use?.("assets").catch(()=>null);

  setStatus("Subiendo foto…");
  try{
    const bmp = await createImageBitmap(file); const k = Math.min(1, 900/Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r=>cv.toBlob(r, "image/jpeg", 0.85));

function kcalPill(k, target){
  const txt = `<span class="num">${nf(k)}</span> kcal`;

/* ----- Catálogo de Mercadona (copia del de la app «Lista de la compra») ----- */
const CAT_COLS = 8, NON_FOOD = new Set([20,21,22,23,24,25,26]);
const SYN = {ternera:"vacuno", vaca:"vacuno", buey:"vacuno"};
const STOP = new Set(["de","del","la","el","los","las","con","al","a","y","en","para","sin","o"]);
async function loadCat(){
  if(S.cat || S.catLoading || S.catErr) return; S.catLoading = true;
  try{
    const r = await fetch(CAT_BASE+"mercadona.json"); if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    const food = new Set(d.tops.filter(t=>!NON_FOOD.has(t.id)).flatMap(t=>t.subs.map(String)));
    const p = d.p.filter(x=>food.has(String(x[6])) && d.subs[x[6]]);
    S.cat = {updated:d.updated, subs:d.subs, p, idx:p.map(x=>norm(x[1])), byId:new Map(p.map(x=>[String(x[0]),x]))};
  }catch(e){ S.catErr = true; }
  S.catLoading = false;
  if(sheetCtx?.type==="build"){ if(sheetCtx.adding) drawFoods(); else renderBuilder(); }
  else if(!sheetCtx) render();
}
const words = s => norm(s).split(/[^a-z0-9ñ]+/).filter(w=>w && !STOP.has(w));
function catSearch(q, n=40){
  const C=S.cat; if(!C) return [];
  const qw = words(q); if(!qw.length) return [];
  const res = [];
  C.p.forEach((r,i)=>{
    const name = C.idx[i], nw = name.split(/[^a-z0-9ñ]+/);
    let s = 0;
    for(const w of qw){
      const stem = w.length>4 ? w.replace(/(es|s)$/,"") : w;
      const alt = SYN[w];
      if(nw.includes(w) || (alt && nw.includes(alt))) s += 3; else if(nw.some(x=>x.startsWith(stem))) s += 2; else s -= 4;
    }
    if(s<=0) return;
    if(nw[0] && nw[0].startsWith(qw[0].slice(0,4))) s += 2;
    s -= nw.length*0.15;
    res.push([s,r]);
  });
  return res.sort((a,b)=>b[0]-a[0]).slice(0,n).map(x=>x[1]);
}
function sprStyle(r){
  const rows = S.cat.subs[r[6]]?.rows || 1, c = r[7]%CAT_COLS, row = Math.floor(r[7]/CAT_COLS);
  return `background-image:url(${CAT_BASE}s${+r[6]}.jpg);background-size:${CAT_COLS*100}% ${rows*100}%;background-position:${c/(CAT_COLS-1)*100}% ${rows>1?row/(rows-1)*100:0}%`;
}
const spr = r => `<span class="spr" style="${sprStyle(r)}" role="img" aria-label="${esc(r[1])}"></span>`;
// Foto de un alimento de la dieta: el producto de Mercadona enlazado en la compra o, si no, el que mejor coincide
function alimPhoto(a){
  if(!S.cat) return null;
  const name = a.por?.[0]?.n || a.n, id = S.links[norm(name)];
  if(id === "none") return null;
  if(id && S.cat.byId.has(String(id))) return S.cat.byId.get(String(id));
  if(a.foto === "none") return null;
  if(a.foto && S.cat.byId.has(String(a.foto))) return S.cat.byId.get(String(a.foto));
  if(!photoCache.has(a.id)) photoCache.set(a.id, catSearch(name,1)[0] || null);
  return photoCache.get(a.id);
}
function thumb(a, cls=""){
  const r = alimPhoto(a);
  return r ? `<span class="spr th ${cls}" style="${sprStyle(r)}" aria-hidden="true"></span>` : `<span class="th ph ${cls}" aria-hidden="true">${esc((a.n||"?").charAt(0))}</span>`;
}
function packSize(r){
  const m = String(r[3]||"").toLowerCase().replace(/,/g,".").match(/(?:(\d+)\s*x\s*)?(\d+(?:\.\d+)?)\s*(kg|g|ml|cl|l|ud)\b/);
  if(!m) return null;
  let q = +m[2]*(m[1]?+m[1]:1), u = m[3];
  if(UNIT_NORM[u]){ q*=UNIT_NORM[u][1]; u=UNIT_NORM[u][0]; }
  return {q,u};
}
// Producto enlazado (elegido por ti) o sugerido (mejor coincidencia por nombre)
function productFor(it){
  if(!S.cat) return null;
  const k = norm(it.n), id = S.links[k];
  if(id === "none") return {none:true};
  if(id && S.cat.byId.has(String(id))) return {r:S.cat.byId.get(String(id)), sure:true};
  const f = S.fotoByName?.get(k);
  if(f === "none") return null;
  if(f && S.cat.byId.has(String(f))) return {r:S.cat.byId.get(String(f)), sure:false};
  const r = catSearch(it.n,1)[0];
  return r ? {r, sure:false} : null;
}
function packsFor(it, r){
  const ps = packSize(r);
  if(ps && ps.u===it.u && ps.q>0) return {n:Math.max(1, Math.ceil(it.q/ps.q - 0.03)), exact:true};
  return {n:1, exact:false};
}

function listText(){
  const list = shoppingList(); const by = {};
  for(const it of list) if(!S.semana.comprado[it.key]) (by[CATS.includes(it.cat)?it.cat:"Otros"] ||= []).push(it);

    }).join("") + (pesoKg()?`<div class="muted small">Proteína: <span class="num">${nf(avg("p")/pesoKg(),1)}</span> g por kg de peso.</div>`:"") + (!obj.kcal?`<div class="muted small">Pon los objetivos de tu nutricionista en la pestaña <a href="#dieta">Dieta</a> para comparar.</div>`:"") + `</section>`;
  }

  // Calorías y proteína de la semana, justo antes del perfil
  h += kcalCard(planned) + protCard(planned);

  // Perfil
  h += `<section class="card stack"><h3 class="bhead">Tu perfil</h3><div class="muted small">Se usa para calcular tu gasto (fórmula de Mifflin-St Jeor).</div>
    <form id="perfilForm" class="formgrid">
      <label class="f">Sexo<select id="psexo"><option value="h" ${P.sexo!=="m"?"selected":""}>Hombre</option><option value="m" ${P.sexo==="m"?"selected":""}>Mujer</option></select></label>
      <label class="f">Edad<input id="pedad" type="number" min="14" max="99" inputmode="numeric" value="${P.edad??""}" placeholder="años"></label>
      <label class="f">Peso (kg)<input id="ppeso" type="number" min="35" max="250" step="0.1" inputmode="decimal" value="${P.peso??""}" placeholder="kg"></label>
      <label class="f">Altura (cm)<input id="paltura" type="number" min="130" max="230" inputmode="numeric" value="${P.altura??""}" placeholder="cm"></label>
      <label class="f full">Tu día a día sin contar el deporte<select id="pact">${NEAT.map(n=>`<option value="${n.f}" ${(+P.actividad||1.2)===n.f?"selected":""}>${n.n}</option>`).join("")}</select></label>
    </form>
    ${b?`<div class="muted small">Metabolismo basal: <b class="num">${nf(b)}</b> kcal · Gasto diario sin deporte: <b class="num">${nf(base)}</b> kcal</div>`:""}</section>`;
  return h;
}

const KCAL_WHY = {

function kcalCard(planned){
  const tgtPlan = planMacros().kcal || 0, M = S.perfil.meta||{}, G = GOALS[M.tipo];
  const st = weekStats(), T = G && st.b ? goalTarget(st) : null;
  const tgtGoal = T ? st.out + T.lo : 0, target = Math.max(tgtPlan, tgtGoal);
  if(!target || !planned.length) return "";
  const avgK = planned.reduce((a,t)=>a+t.kcal,0)/planned.length, falta = target - avgK;
  const src = tgtGoal > tgtPlan ? `lo mínimo para ${G.n.toLowerCase()} con lo que gastas esta semana` : "lo que pide tu plan";
  if(falta < 30) return `<section class="card stack"><h3 class="bhead">Calorías de la semana</h3><div class="tip good"><span class="mark" aria-hidden="true">✓</span><div><b>Llegas a tus calorías</b><div class="small">Comes de media <b class="num">${nf(avgK)} kcal</b> al día y la meta es ${nf(target)} kcal (${src}).</div></div></div></section>`;
  return `<section class="card stack"><h3 class="bhead">Calorías de la semana</h3>
    <div class="protgap"><div class="tile"><span class="k">Te faltan al día</span><span class="v">${nf(falta)} kcal</span></div><div class="tile"><span class="k">En toda la semana</span><span class="v">${nf(falta*7)} kcal</span></div></div>
    <div class="small">Comes de media <b class="num">${nf(avgK)} kcal</b> al día y la meta es <b class="num">${nf(target)} kcal</b> (${src}).${tgtGoal>tgtPlan && tgtPlan ? ` Tu plan marca ${nf(tgtPlan)} kcal.` : ""}</div>
    <div class="why"><b>Por qué importa${G ? ` para ${G.n.toLowerCase()}` : ""}:</b> ${KCAL_WHY[M.tipo] || KCAL_WHY._}</div></section>`;
}
function protCard(planned){
  const tgtPlan = planMacros().p || 0, M = S.perfil.meta||{}, G = GOALS[M.tipo], kg = pesoKg();
  const tgtGoal = G && kg ? G.prot[0]*kg : 0, target = Math.max(tgtPlan, tgtGoal);
  if(!target || !planned.length) return "";
  const avgP = planned.reduce((a,t)=>a+t.p,0)/planned.length, falta = target - avgP;
  const src = tgtGoal > tgtPlan ? `el mínimo para ${G.n.toLowerCase()}: ${nf(G.prot[0],1)} g por kg × ${nf(kg,1)} kg` : "lo que pide tu plan";
  if(falta < 3) return `<section class="card stack"><h3 class="bhead">Proteína de la semana</h3><div class="tip good"><span class="mark" aria-hidden="true">✓</span><div><b>Proteína cubierta</b><div class="small">Tomas de media <b class="num">${nf(avgP)} g</b> al día y la meta es ${nf(target)} g (${src}).</div></div></div></section>`;
  return `<section class="card stack"><h3 class="bhead">Proteína de la semana</h3>
    <div class="protgap"><div class="tile"><span class="k">Te faltan al día</span><span class="v">${nf(falta)} g</span></div><div class="tile"><span class="k">En toda la semana</span><span class="v">${nf(falta*7)} g</span></div></div>
    <div class="small">Tomas de media <b class="num">${nf(avgP)} g</b> al día y la meta es <b class="num">${nf(target)} g</b> (${src}).${tgtGoal>tgtPlan && tgtPlan ? ` Tu plan marca ${nf(tgtPlan)} g.` : ""}</div>
    <div class="why"><b>Por qué importa${G ? ` para ${G.n.toLowerCase()}` : ""}:</b> ${PROT_WHY[M.tipo] || PROT_WHY._}</div></section>`;
}

// Gráfico de barras: por día, lo que comes frente a lo que gastas (reposo + deporte apilados)
function dayChart(inDay, base, sport, totals){
  const W=700, H=280, L=52, R=8, T=12, B=52, ph=H-T-B, pw=W-L-R, gw=pw/7, bw=Math.min(30, gw*0.32);
  const top = Math.max(...inDay, ...sport.map(s=>base+s), 1);
  const step = top>3000 ? 1000 : 500, ymax = Math.ceil(top/step)*step;
  const y = v => T + ph - v/ymax*ph;
  const bar = (x,y0,y1,round) => { const h=y0-y1; if(h<=0) return ""; const r=round?Math.min(4,h):0;
    return `M${x},${y0}V${y1+r}${r?`Q${x},${y1} ${x+r},${y1}`:""}H${x+bw-r}${r?`Q${x+bw},${y1} ${x+bw},${y1+r}`:""}V${y0}Z`; };
  let s = `<svg viewBox="0 0 ${W} ${H}" class="dchart" role="img" aria-label="Calorías que comes y que gastas cada día de la semana">`;
  for(let v=0; v<=ymax; v+=step) s += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="${v?"grid":"axis"}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="tick">${nf(v)}</text>`;
  DAYS.forEach((d,i)=>{
    const cx = L + gw*i + gw/2, x1 = cx - bw - 2, x2 = cx + 2, base0 = y(0);
    const diff = inDay[i] - (base + sport[i]);
    s += `<g class="dg"><title>${d}: comes ${nf(inDay[i])} kcal${totals[i].n?"":" (media, sin menú)"} · gastas ${nf(base+sport[i])} kcal (${nf(base)} reposo + ${nf(sport[i])} deporte) · ${sgn(diff)} kcal</title>
      <rect x="${cx-gw/2}" y="${T}" width="${gw}" height="${ph}" class="hit"/>
      <path d="${bar(x1, base0, y(inDay[i]), true)}" fill="var(--prot)" ${totals[i].n?"":"fill-opacity=\".4\""}/>
      <path d="${bar(x2, base0, y(base), !sport[i])}" fill="var(--muted)"/>
      ${sport[i] ? `<path d="${bar(x2, y(base)-2, y(base+sport[i]), true)}" fill="var(--carb)"/>` : ""}
      <text x="${cx}" y="${H-B+18}" text-anchor="middle" class="dl">${d.slice(0,3)}</text>
      <text x="${cx}" y="${H-B+36}" text-anchor="middle" class="dd ${diff<0?"neg":"pos"}">${sgn(diff)}</text></g>`;
  });
  return s + `</svg>`;
}

/* ----- Objetivo y plan ----- */
function weekStats(){
  const totals = DAYS.map((_,d)=>dayTotals(d));
  const planned = totals.filter(t=>t.n);
  const avg = k => planned.length ? planned.reduce((a,t)=>a+t[k],0)/planned.length : 0;
  const b = bmr(); const base = b ? b*(+S.perfil.actividad||1.2) : 0;
  const sport = sportByDay().reduce((a,x)=>a+x,0)/7;
  const ses = S.semana.deporte;
  return { b, base, planned:planned.length, kcal:avg("kcal"), p:avg("p"), c:avg("c"), g:avg("g"), sport,
    out: base+sport, perDay: avg("kcal")-(base+sport), peso:pesoKg(),
    fuerza: ses.filter(s=>STRENGTH.includes(s.act)).length,
    cardio: Math.round(ses.reduce((a,s)=>a+cardioMin(s),0)),
    sesiones: ses.length, minTotal: ses.reduce((a,s)=>a+(+s.min||0),0) };
}
function goalTarget(st){
  const M = S.perfil.meta||{}; const G = GOALS[M.tipo]; if(!G) return null;
  let lo=G.bal[0], hi=G.bal[1], note="";
  if(+M.peso && M.fecha && st.peso){
    const days = Math.round((new Date(M.fecha) - new Date())/864e5);
    if(days>6){
      let need = (M.peso - st.peso)*KCAL_KG/days;
      const maxLoss = st.peso*0.01*KCAL_KG/7, maxGain = st.peso*0.005*KCAL_KG/7;
      if(need < -maxLoss){ note = `Llegar a ${nf(M.peso,1)} kg el ${fmtDate(M.fecha)} pediría bajar más del 1 % de tu peso por semana: es demasiado rápido. Te marco el máximo recomendable.`; need = -maxLoss; }
      else if(need > maxGain){ note = `Subir hasta ${nf(M.peso,1)} kg para el ${fmtDate(M.fecha)} es demasiado rápido para que sea músculo. Te marco un ritmo más realista.`; need = maxGain; }
      else note = `Para llegar a ${nf(M.peso,1)} kg el ${fmtDate(M.fecha)} (${Math.round(days/7)} semanas) necesitas un ${need<0?"déficit":"superávit"} de unas ${nf(Math.abs(need))} kcal/día.`;
      lo = need-100; hi = need+100;
    }
  }
  return {G, lo, hi, mid:(lo+hi)/2, note};
}
function fmtDate(s){ const d=new Date(s); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function goalAdvice(){
  const st = weekStats(); const T = goalTarget(st); if(!T) return null;
  const {G} = T; const tips = [];
  if(!st.b){ tips.push({s:"warn", t:"Faltan tus datos", d:`Rellena edad, peso y altura en <a href="#balance">Balance › Tu perfil</a> para calcular tu gasto.`}); return {T, st, tips}; }
  if(!st.planned){ tips.push({s:"warn", t:"Elige el menú de la semana", d:`Sin comidas elegidas no sé cuánto comes. Ve al <a href="#menu">Menú</a>.`}); }
  else {
    // Calorías
    const gap = T.mid - st.perDay;
    if(st.perDay >= T.lo && st.perDay <= T.hi){
      tips.push({s:"good", t:"Calorías en su sitio", d:`Vas con ${st.perDay<0?"un déficit":"un superávit"} de <b class="num">${nf(Math.abs(st.perDay))}</b> kcal/día, justo lo que buscas (${sgn(T.lo)} a ${sgn(T.hi)}).`});
    } else if(gap > 0){
      tips.push({s:"bad", t:`Te faltan unas ${nf(gap)} kcal al día (${nf(gap*7)} kcal en la semana)`, d:`Comes <b class="num">${nf(st.kcal)}</b> y gastas <b class="num">${nf(st.out)}</b>. <b>Por qué importa:</b> ${KCAL_WHY[S.perfil.meta?.tipo] || KCAL_WHY._}`});
    } else {
      const cut = -gap;
      const kg = racKcal("G") || 45, ng = Math.max(0.5, Math.round(cut/kg*2)/2);
      const runMin = st.peso ? Math.round(cut*7/((8.3-1)*st.peso/60)/5)*5 : 0;
      let d = `Comes <b class="num">${nf(st.kcal)}</b> y gastas <b class="num">${nf(st.out)}</b>. Opciones:<ul>`;
      if(runMin) d += `<li>Suma unos <b class="num">${runMin}</b> min de carrera suave a la semana (p. ej. ${Math.max(1,Math.round(runMin/40))} × ${Math.round(runMin/Math.max(1,Math.round(runMin/40)))} min).</li>`;
      d += `<li>O, si tu nutricionista lo ve bien, bajar unas <b>${nf(ng,1)} raciones de grasa</b> al día (≈${nf(kg)} kcal cada una).</li><li>Elige alimentos verdes en vez de naranjas: los naranjas gastan también raciones de otro grupo.</li></ul>`;
      tips.push({s:"bad", t:`Te sobran unas ${nf(cut)} kcal al día`, d});
    }
    // Proteína
    if(st.peso){
      const pkg = st.p/st.peso, [plo,phi] = G.prot;
      if(pkg >= plo) tips.push({s:"good", t:"Proteína suficiente", d:`<b class="num">${nf(pkg,1)}</b> g por kg (objetivo ${nf(plo,1)}–${nf(phi,1)}).`});
      else {
        const falta = plo*st.peso - st.p;
        tips.push({s: pkg>=plo-0.3?"warn":"bad", t:`Te faltan unos ${nf(falta)} g de proteína al día (${nf(falta*7)} g en la semana)`, d:`Tomas <b class="num">${nf(pkg,1)}</b> g por kg y para ${G.n.toLowerCase()} conviene ${nf(plo,1)}–${nf(phi,1)}. <b>Por qué importa:</b> ${PROT_WHY[S.perfil.meta?.tipo] || PROT_WHY._}`});
      }
      if(G.carb){
        const ckg = st.c/st.peso;
        tips.push(ckg>=G.carb ? {s:"good", t:"Hidratos para entrenar", d:`<b class="num">${nf(ckg,1)}</b> g por kg; para rendir conviene ${G.carb} o más.`}
          : {s:"warn", t:"Pocos hidratos para tu volumen de entreno", d:`Tomas <b class="num">${nf(ckg,1)}</b> g/kg; para rendir conviene ${G.carb} g/kg o más, sobre todo los días de entreno y partido (arroz, pasta, patata, pan, fruta).`});
      }
    }
  }
  // Fuerza
  if(st.fuerza >= G.fuerza) tips.push({s:"good", t:"Fuerza", d:`${st.fuerza} sesiones de fuerza esta semana (mínimo ${G.fuerza}).`});
  else tips.push({s: st.fuerza ? "warn" : "bad", t:`Añade ${G.fuerza-st.fuerza} ${G.fuerza-st.fuerza===1?"sesión":"sesiones"} de fuerza`, d:`Para ${G.n.toLowerCase()} conviene entrenar fuerza al menos ${G.fuerza} veces por semana (llevas ${st.fuerza}). <button class="btn" style="margin-top:6px" data-act="addsport" data-preset="pesas">Añadir sesión de pesas</button>`});
  // Cardio
  if(G.cardio){
    if(st.cardio >= G.cardio) tips.push({s:"good", t:"Cardio", d:`${st.cardio} min esta semana (recomendado ${G.cardio}).`});
    else tips.push({s:"warn", t:`Suma ${G.cardio-st.cardio} min de cardio`, d:`Llevas ${st.cardio} min de ${G.cardio} recomendados (caminar rápido, bici, correr…; de CrossFit e Hyrox cuenta la mitad del tiempo). <button class="btn" style="margin-top:6px" data-act="addsport" data-preset="caminar">Añadir cardio</button>`});
  }
  if(st.peso && st.planned && T.mid){
    const kgW = st.perDay*7/KCAL_KG;
    tips.push({s:"neutral", t:"A este ritmo", d:`<b class="num">${sgn(kgW,2)}</b> kg por semana · <b class="num">${sgn(kgW*4.3,1)}</b> kg al mes.`});
  }
  return {T, st, tips};
}

        <label class="f">Hidratos (g)<input id="pm-c" type="number" min="0" inputmode="numeric" value="${M.c??""}"></label>
        <label class="f">Proteína (g)<input id="pm-p" type="number" min="0" inputmode="numeric" value="${M.p??""}"></label>

      <div class="small muted">Las raciones de cada comida se cambian en la tabla de arriba.</div>
    </details>
    <div class="small">Y cada día: <b>${P.dist.fruta?.F??2} raciones de fruta</b> y <b>2 o 3 de verdura</b> (añádela dentro de la comida o la cena). El batido post-entreno se suma solo los días que lo marcas en el Menú.</div>
  </section>`;
  h += viewGoal();
  // Mis platos
  const ps = platosList();
  h += `<div class="sectionhead"><div><h2>Mis platos</h2><div class="muted small">Combinaciones que cumplen las raciones de una comida. En el Menú se ponen con un toque.</div></div><button class="btn primary" data-act="newplato">Nuevo plato</button></div>`;
  if(!ps.length) h += `<div class="card empty"><h3>Sin platos guardados</h3><div>Monta una comida en el Menú y pulsa <b>Guardar como plato</b>, o crea uno aquí.</div></div>`;
  for(const m of MAIN_MEALS){
    const list = ps.filter(p=>p.comida===m).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
    if(!list.length) continue;
    h += `<section class="card"><h3 class="bhead">${MEALS.find(x=>x.id===m).n}</h3>` + list.map(p=>{ const t=itemsTotals(p.items);
      return `<div class="sess withpic">${dishPic(p,"sm")}<div style="min-width:0"><div class="t">${esc(p.nombre)}${p.propuesta?` <span class="pill neutral">propuesta</span>`:""}</div>${p.foto && p.credito ? `<div class="credit">${p.fuente ? `<a href="${esc(p.fuente)}" target="_blank" rel="noopener">${esc(p.credito)}</a>` : esc(p.credito)}</div>` : ""}
        <div class="muted small">${p.items.map(it=>{ const a=alim(it.a); return a?`${esc(a.n)} ${porText(a,it.r)}`:""; }).filter(Boolean).join(" · ")}</div>
        <div class="rcrow"><span class="pill neutral"><span class="num">${nf(t.kcal)}</span> kcal</span>${racChips(t.r, mealDist(m))}</div></div>

  }

  h += `<div class="sectionhead"><div><h2>Tabla de alimentos</h2><div class="muted small">Gramos de 1 ración, pesados en crudo. Toca uno para corregirlo.</div></div><button class="btn" data-act="newfood">Añadir alimento</button></div>
    <section class="card stack"><h3 class="bhead">Alimentos de tu dieta</h3><div class="seg">${Object.keys(GRP).map(g=>`<button type="button" data-act="tgrp" data-g="${g}" aria-pressed="${S.dietGrp===g}">${GRP[g].n}</button>`).join("")}</div>

  // Explicación, suplementos y permitidos

      <li>Los gramos son <b>en crudo</b>. Cocinado: arroz y pasta ×2,5; legumbres ×3; carne y pescado a la plancha u horno, un 25 % menos.</li>
      <li><b>Naranja</b> en hidratos: leches y kéfir desnatado restan 1 ración de proteína cada uno; legumbres, 1 de proteína por cada 2 raciones. <b>Naranja</b> en proteína: resta 1 ración de grasa. La app ya lo descuenta.</li>
      <li><b>Rojo</b>: como mucho 2 raciones al día de cada macro.</li>
      <li>Entre comidas, al menos 2 h 30 min. Pre-entreno: entre 1 y 3 h antes. Post-entreno: tras el batido espera 30 min; sin batido, come en las 4 h siguientes.</li>
      <li>Tu plan no da gramos para la verdura: la app cuenta 150 g por ración (100 g en hojas).</li>
    </ul></details>
    <details class="card info"><summary><h3>Suplementación</h3></summary><ul>${(P.suplementos||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ul></details>
    <details class="card info"><summary><h3>Salsas, bebidas y extras permitidos</h3></summary><ul>${(P.permitidos||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ul></details>`;
  return h;
}

  el.innerHTML = list.map(a=>`<button class="trow" data-act="editfood" data-id="${a.id}">${thumb(a)}<span class="tn"><span>${DOT(a)}${esc(a.n)}</span><small class="muted">${xText(a).replace(" · ","")}</small></span><span class="num">${porText(a,1)}</span></button>`).join("") || `<div class="empty">Nada con «${esc(S.dietQ)}».</div>`;
}

    <label class="f">Color en tu dieta<select id="fc">${Object.entries(COLS).map(([k,c])=>`<option value="${k}" ${k===a.col?"selected":""}>${c.n}</option>`).join("")}</select></label>

    <label class="f full">Sección del súper<select id="fcat">${CATS.map(c=>`<option ${c===a.cat?"selected":""}>${c}</option>`).join("")}</select></label>

    if(x) upd.x = x; else delete upd.x;
    if(!multi) upd.por = [{n: n.replace(/\s*\(.*?\)\s*$/,""), q:+$("#fq2").value||0, u:$("#fu").value}];
    if(id){ const i=S.plan.alimentos.findIndex(z=>z.id===id); S.plan.alimentos[i]=upd; }
    else { upd.id = grp.toLowerCase()+"-"+norm(n).replace(/[^a-z0-9]+/g,"-").slice(0,40)+"-"+Date.now().toString(36); S.plan.alimentos.push(upd); }

async function savePlato(){
  const c = sheetCtx; const nombre = (c.nombre||"").trim();
  if(!nombre){ $("#bnombre")?.focus(); setStatus("Ponle un nombre al plato"); return; }
  if(!c.items.length){ setStatus("Añade algún alimento al plato"); return; }
  const data = {nombre, comida:c.meal, items:clone(c.items), ...(c.foto ? {foto:c.foto} : {}), ...(c.foto && c.credito ? {credito:c.credito, ...(c.fuente ? {fuente:c.fuente} : {})} : {})};
  const old = c.id && S.platos[c.id]?.foto;
  if(old && old !== c.foto) dropAsset(old);
  const ref = c.id ? S.db?.doc("platos/"+c.id) : S.db?.collection("platos").doc();
  const id = ref ? ref.id : (c.id || "local-"+Date.now());
  S.platos[id] = data; closeSheet(); render();
  if(ref){ setStatus("Guardando…"); try{ await ref.set(data); setStatus("Plato guardado"); }catch(err){ setStatus("No se pudo guardar el plato"); } }
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if(!t) return;
  const a = t.dataset.act;
  if(a==="pick") openBuilder({mode:"day", day:+t.dataset.day, meal:t.dataset.meal});
  else if(a==="adding"){ sheetCtx.adding = t.dataset.g || null; sheetCtx.q = ""; renderBuilder(); $("#sheet").scrollTop = 0; }
  else if(a==="addfood"){
    const c = sheetCtx, items = bItems(), f = alim(t.dataset.id), dist = mealDist(c.meal);
    const rem = (dist[f.grp]||1) - (itemsTotals(items).r[f.grp]||0);
    const r = rem >= 0.5 ? Math.round(rem*2)/2 : 1;
    const ex = items.find(x=>x.a===f.id);
    if(ex) ex.r += r; else items.push({a:f.id, r});
    c.adding = null; commitB(); renderBuilder();
  }
  else if(a==="rstep"){ const it = bItems()[+t.dataset.i]; it.r = Math.max(0.5, Math.round((it.r + +t.dataset.d)*2)/2); commitB(); renderBuilder(); }
  else if(a==="rdel"){ bItems().splice(+t.dataset.i,1); commitB(); renderBuilder(); }
  else if(a==="useplato"){ const p=S.platos[t.dataset.id]; const arr=bItems(); arr.splice(0, arr.length, ...clone(p.items)); commitB(); renderBuilder(); }
  else if(a==="copymeal"){
    const c = sheetCtx; const days = [...document.querySelectorAll("#bdias [aria-pressed=true]")].map(b=>+b.dataset.v);
    if(!days.length){ setStatus("Marca los días a los que copiar"); return; }
    for(const d of days){ (S.semana.menu[d] ||= {})[c.meal] = clone(bItems()); }
    saveWeek(); setStatus(`Copiado a ${days.length} día(s)`); renderBuilder();
  }
  else if(a==="asplato"){ const c=sheetCtx; openBuilder({mode:"plato", meal:c.meal, items:clone(bItems()), nombre:""}); setTimeout(()=>$("#bnombre")?.focus(), 50); }
  else if(a==="saveplato") savePlato();
  else if(a==="delplato"){
    if(!t.dataset.sure){ t.dataset.sure="1"; t.textContent="Pulsa otra vez para borrarlo"; return; }
    const id = sheetCtx.id; delete S.platos[id]; closeSheet(); render();
    try{ await S.db?.doc("platos/"+id).delete(); }catch(err){ setStatus("No se pudo borrar"); }
  }
  else if(a==="tgrp"){ S.dietGrp = t.dataset.g; S.dietQ = ""; render(); }
  else if(a==="editfood") openFood(t.dataset.id);
  else if(a==="newfood") openFood(null);
  else if(a==="delfood"){
    if(!t.dataset.sure){ t.dataset.sure="1"; t.textContent="Pulsa otra vez para borrar"; return; }
    S.plan.alimentos = S.plan.alimentos.filter(z=>z.id!==sheetCtx.id); indexPlan(); savePlan(); closeSheet(); render();
  }
  else if(a==="startplan"){
    if(!window.DIETA_PLANTILLA || !S.db) return;
    t.disabled = true; t.textContent = "Cargando…";
    try{
      const tpl = await window.DIETA_PLANTILLA();
      S.plan = clone(tpl.plan); indexPlan();
      await S.db.doc("config/plan").set(clone(S.plan));
      for(const [id,p] of Object.entries(tpl.platos||{})){ S.platos[id] = clone(p); await S.db.doc("platos/"+id).set(clone(p)); }
      setStatus("Tabla base cargada: ajusta tu plan en Dieta"); location.hash = "#dieta"; render();
    }catch(err){ t.disabled = false; t.textContent = "Reintentar"; setStatus("No se pudo cargar la tabla base"); }
  }
  else if(a==="clearmeal"){ bItems().splice(0); commitB(); renderBuilder(); setStatus("Comida borrada: elige otra cosa"); }
  else if(a==="repeatmenu") openRepeat();
  else if(a==="repweeks"){ sheetCtx.n = +t.dataset.n; drawRepeat(); }
  else if(a==="repeatgo") repeatMenu(t);
  else if(a==="cheaton"){ const c=sheetCtx; S.semana.cheat ||= {}; (S.semana.cheat[c.day] ||= {})[c.meal] = {t:"rest", k:900, n:""}; saveWeek(); renderBuilder(); }
  else if(a==="cheatoff"){ const c=sheetCtx; if(S.semana.cheat?.[c.day]) delete S.semana.cheat[c.day][c.meal]; saveWeek(); renderBuilder(); }
  else if(a==="cheatset"){ const c=sheetCtx, ch=cheatOf(c.day,c.meal); if(!ch) return; ch[t.dataset.f] = t.dataset.f==="k" ? +t.dataset.v : t.dataset.v; saveWeek(); renderBuilder(); }
  else if(a==="goday"){ document.getElementById("day-"+t.dataset.day)?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"}); }
  else if(a==="batido"){ const d=+t.dataset.day; S.semana.batido ||= {}; if(S.semana.batido[d]) delete S.semana.batido[d]; else S.semana.batido[d]=true; saveWeek(); render(); }
  else if(a==="close"){ closeSheet(); render(); }
  else if(a==="autofill"){
    let n=0;
    for(let d=0; d<7; d++) for(const m of MAIN_MEALS){
      const ps = platosList().filter(p=>p.comida===m);
      if(ps.length && !slot(d,m).length){ (S.semana.menu[d] ||= {})[m] = clone(ps[(d + n) % ps.length].items); n++; }
    }
    if(n){ saveWeek(); render(); setStatus(`Rellenadas ${n} comidas con tus platos`); }
    else setStatus(platosList().length ? "No queda ninguna comida vacía" : "Primero guarda algún plato en la pestaña Dieta");
  }
  else if(a==="clearmenu"){
    if(t.dataset.sure){ S.semana.menu = {}; S.semana.cheat = {}; saveWeek(); render(); }
    else { t.dataset.sure="1"; t.textContent="Pulsa otra vez para vaciar"; t.classList.add("danger"); }
  }
  else if(a==="copyprev" || a==="copysport"){

    if(!S.db){ setStatus("Sin conexión con los datos"); return; }
    const snap = await S.db.doc("semanas/"+prev).get();

    if(a==="copyprev"){ if(!w || !Object.keys(w.menu).length){ setStatus("La semana anterior no tiene menú"); return; } S.semana.menu = clone(w.menu); S.semana.batido = clone(w.batido||{}); }
    else { if(!w || !w.deporte.length){ setStatus("La semana anterior no tiene deporte"); return; } S.semana.deporte = clone(w.deporte); }
    saveWeek(); render(); setStatus("Copiado de la semana anterior");
  }
  else if(a==="buy"){ const k=t.dataset.key; if(t.checked) S.semana.comprado[k]=true; else delete S.semana.comprado[k]; saveWeek(); render(); }
  else if(a==="buyx"){ S.semana.extra[+t.dataset.i].ok = t.checked; saveWeek(); render(); }
  else if(a==="delx"){ S.semana.extra.splice(+t.dataset.i,1); saveWeek(); render(); }
  else if(a==="copylist"){
    const txt = listText();
    try{ await navigator.clipboard.writeText(txt); t.textContent="¡Copiada!"; setTimeout(()=>t.textContent="Copiar lista",1800); }
    catch{ openSheet(`<div class="grab"></div><div class="sectionhead"><h2>Tu lista</h2><button class="btn primary" data-act="close">Cerrar</button></div><div class="muted small">Selecciona el texto y cópialo.</div><textarea id="listTxt" rows="14" readonly>${esc(txt)}</textarea>`,{type:"txt"}); $("#listTxt").select(); }
  }
  else if(a==="pickprod"){ e.preventDefault(); if(!S.cat){ loadCat(); return; } openProdPicker(t.dataset.name); }
  else if(a==="linkprod"){ S.links = {...S.links, [sheetCtx.key]: t.dataset.id}; saveLinks(); closeSheet(); render(); }
  else if(a==="addsport") openSport(null, t.dataset.preset, t.dataset.day);
  else if(a==="goal"){ S.perfil.meta = {...(S.perfil.meta||{}), tipo:t.dataset.v}; S.advice=null; savePerfil(); render(); }
  else if(a==="askclaude") askClaude(t);
  else if(a==="editsport") openSport(+t.dataset.i);
  else if(a==="delsport"){ S.semana.deporte.splice(+t.dataset.i,1); saveWeek(); closeSheet(); render(); }
  else if(a==="newplato") openBuilder({mode:"plato", meal:"comida", items:[], nombre:""});
  else if(a==="editplato"){ const p=S.platos[t.dataset.id]; openBuilder({mode:"plato", id:t.dataset.id, meal:p.comida, items:clone(p.items), nombre:p.nombre, foto:p.foto||null, credito:p.credito||null, fuente:p.fuente||null}); }
  else if(a==="rmfoto"){ sheetCtx.foto = null; sheetCtx.credito = sheetCtx.fuente = null; renderBuilder(); }
});

});

/* ---------- Navegación ---------- */
function route(){ const h=location.hash.slice(1); S.tab = ["menu","compra","deporte","balance","dieta"].includes(h)?h:"menu"; closeSheet(); render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", route);
$("#prevWeek").addEventListener("click", ()=>changeWeek(-7));
$("#nextWeek").addEventListener("click", ()=>changeWeek(7));
function changeWeek(n){ S.monday = addDays(S.monday,n); S.semana = emptyWeek(); S.loaded.semana = !S.db; subscribeWeek(); render(); }
function loadingCard(){ return `<div class="card empty">Cargando tus datos…</div>`; }

/* ---------- Datos ---------- */
let unsubWeek = null;
function subscribeWeek(){
  if(!S.db) return;
  unsubWeek?.();
  const path = weekPath();
  unsubWeek = S.db.doc(path).onSnapshot(snap => {
    if(path!==weekPath() || busy(path)) return;
    S.semana = weekOf(snap.exists ? clone(snap.data()) : null); S.loaded.semana = true;
    if(!sheetCtx) render();
  }, err => { S.loaded.semana = true; setStatus("Error al leer la semana"); render(); });
}
async function boot(){
  route();
  const timer = setTimeout(()=>setStatus("No se puede conectar con tus datos todavía…"), 10000);
  const db = await window.claude?.use?.("db").catch(()=>null);
  if(!db){
    clearTimeout(timer);
    S.loaded = {platos:true, perfil:true, semana:true, plan:true};
    setStatus("No se pudo conectar: recarga la página");
    render(); return;
  }
  S.db = db;
  db.collection("platos").onSnapshot(snap => {
    clearTimeout(timer);
    const o={}; snap.docs.forEach(d=>o[d.id]=clone(d.data())); S.platos=o; S.loaded.platos=true;
    if(!snap.metadata.fromCache) setStatus("Al día");
    if(!sheetCtx) render();
  }, () => { S.loaded.platos=true; setStatus("Error al leer la dieta"); render(); });
  db.doc("config/perfil").onSnapshot(snap => {
    if(busy("config/perfil")) return;
    S.perfil = snap.exists ? clone(snap.data()) : {}; S.loaded.perfil=true;
    const f = document.activeElement?.id;
    if(!sheetCtx && !(f && /^(p|o)/.test(f) && document.activeElement.form)) render();
  }, () => { S.loaded.perfil=true; render(); });
  db.doc("config/plan").onSnapshot(snap => {
    if(busy("config/plan")) return;
    S.plan = snap.exists ? clone(snap.data()) : null; indexPlan(); S.loaded.plan = true;
    if(!sheetCtx) render();
  }, () => { S.loaded.plan = true; setStatus("Error al leer el plan"); render(); });
  db.doc("config/mercadona").onSnapshot(snap => {
    if(busy("config/mercadona")) return;
    S.links = snap.exists ? clone(snap.data().links||{}) : {};
    if(!sheetCtx && S.tab==="compra") render();
  }, () => {});
  subscribeWeek();
}
boot();
})();
</script>
